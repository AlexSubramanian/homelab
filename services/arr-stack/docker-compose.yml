services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=977
      - PGID=988
      - TZ=America/Denver
    volumes:
      - /opt/configs/sabnzbd:/config        # Changed to local
      - /mnt/media/data/usenet:/data/usenet
    ports:
      - "8080:8080"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=977
      - PGID=988
      - TZ=America/Denver
    volumes:
      - /opt/configs/prowlarr:/config       # Changed to local
    ports:
      - "9696:9696"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=977
      - PGID=988
      - TZ=America/Denver
    volumes:
      - /opt/configs/sonarr:/config
      - /mnt/media/library/tv:/tv
      - /mnt/media/data:/data
    ports:
      - "8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=977
      - PGID=988
      - TZ=America/Denver
    volumes:
      - /opt/configs/radarr:/config
      - /mnt/media/library/movies:/movies
      - /mnt/media/data:/data
    ports:
      - "7878:7878"
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=977
      - PGID=988
      - TZ=America/Denver
    volumes:
      - /opt/configs/bazarr:/config
      - /mnt/media/library/movies:/movies
      - /mnt/media/library/tv:/tv
    ports:
      - "6767:6767"
    restart: unless-stopped

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:7
    container_name: recyclarr
    user: 977:988
    environment:
      - TZ=America/Denver
    volumes:
      - /opt/configs/recyclarr:/config
    restart: unless-stopped

  pulsarr:
    image: lakker/pulsarr:latest
    container_name: pulsarr
    environment:
      - baseUrl=http://192.168.1.75
      - port=3003
      - TZ=America/Denver
      - logLevel=info
      - authenticationMethod=requiredExceptLocal
    volumes:
      - /opt/configs/pulsarr:/app/data
    ports:
      - "3003:3003"
    restart: unless-stopped

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=America/Denver
    ports:
      - "8191:8191"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8888:8080"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  diun:
    image: crazymax/diun:4
    container_name: diun
    hostname: arr-stack
    command: serve
    environment:
      - TZ=America/Denver
      - LOG_LEVEL=info
      - DIUN_WATCH_WORKERS=10
      - DIUN_WATCH_SCHEDULE=0 */6 * * *
      - DIUN_WATCH_JITTER=30s
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_NOTIF_NTFY_ENDPOINT=https://ntfy.sh
      # NTFY_TOPIC lives in the gitignored .env next to this file
      - DIUN_NOTIF_NTFY_TOPIC=${NTFY_TOPIC:-}
      - DIUN_NOTIF_NTFY_PRIORITY=3
      - 'DIUN_NOTIF_NTFY_TEMPLATETITLE={{ .Meta.Hostname }}: {{ .Entry.Image.Path }}:{{ .Entry.Image.Tag }} has an update'
      - 'DIUN_NOTIF_NTFY_TEMPLATEBODY=New image for {{ .Entry.Metadata.ctn_names }}. Tap to review and update.'
      # Tapping the notification opens the admin page, which is where updates are
      # applied. Until that page ships, the fallback is still
      # `~/homelab/update.sh` on the host named in the title.
      - DIUN_NOTIF_NTFY_CLICK=https://alexsubramanian.com/admin
    volumes:
      - /opt/configs/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
