services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - TZ=America/Denver
      # Served at a domain root rather than a sub-path. Sub-path serving
      # (/admin/grafana) rewrites asset paths and breaks direct LAN access on
      # :3000; a root-level root URL leaves http://192.168.1.228:3000 working.
      - GF_SERVER_ROOT_URL=https://grafana.alexsubramanian.com
      # Grafana keeps its own login. Access gates who reaches the subdomain at
      # all, but a Grafana session shouldn't be granted just by arriving there.
      - GF_SERVER_ENFORCE_DOMAIN=false
    volumes:
      - /opt/configs/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
    volumes:
      - /opt/configs/prometheus:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  diun:
    image: crazymax/diun:4
    container_name: diun
    hostname: rpi4b
    command: serve
    environment:
      - TZ=America/Denver
      - LOG_LEVEL=info
      - DIUN_WATCH_WORKERS=10
      - DIUN_WATCH_SCHEDULE=0 */6 * * *
      - DIUN_WATCH_JITTER=30s
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_NOTIF_NTFY_ENDPOINT=https://ntfy.sh
      # NTFY_TOPIC lives in the gitignored .env next to this file
      - DIUN_NOTIF_NTFY_TOPIC=${NTFY_TOPIC:-}
      - DIUN_NOTIF_NTFY_PRIORITY=3
      - 'DIUN_NOTIF_NTFY_TEMPLATETITLE={{ .Meta.Hostname }}: {{ .Entry.Image.Path }}:{{ .Entry.Image.Tag }} has an update'
      - 'DIUN_NOTIF_NTFY_TEMPLATEBODY=New image for {{ .Entry.Metadata.ctn_names }}. Tap to review and update.'
      # Tapping the notification opens the admin page, which is where updates are
      # applied. Until that page ships, the fallback is still
      # `~/homelab/update.sh` on the host named in the title.
      - DIUN_NOTIF_NTFY_CLICK=https://alexsubramanian.com/admin
    volumes:
      - /opt/configs/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
