services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    network_mode: host
    environment:
      - TZ=America/Denver
      - PLEX_UID=977
      - PLEX_GID=988
    volumes:
      - /opt/plex-config:/config
      - /mnt/media/library:/media
      - /dev/shm:/transcode
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=977
      - PGID=988
      - TZ=America/Denver
    volumes:
      - /opt/configs/tautulli:/config
    ports:
      - "8181:8181"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8888:8080"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  diun:
    image: crazymax/diun:4
    container_name: diun
    hostname: plex
    command: serve
    environment:
      - TZ=America/Denver
      - LOG_LEVEL=info
      - DIUN_WATCH_WORKERS=10
      - DIUN_WATCH_SCHEDULE=0 */6 * * *
      - DIUN_WATCH_JITTER=30s
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_NOTIF_NTFY_ENDPOINT=https://ntfy.sh
      # NTFY_TOPIC lives in the gitignored .env next to this file
      - DIUN_NOTIF_NTFY_TOPIC=${NTFY_TOPIC:-}
      - DIUN_NOTIF_NTFY_PRIORITY=4
      - 'DIUN_NOTIF_NTFY_TEMPLATETITLE={{ .Meta.Hostname }}: {{ .Entry.Image.Path }}:{{ .Entry.Image.Tag }} has an update'
      - 'DIUN_NOTIF_NTFY_TEMPLATEBODY=New image for {{ .Entry.Metadata.ctn_names }}. Run ~/homelab/update.sh on {{ .Meta.Hostname }} to install it.'
    volumes:
      - /opt/configs/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
